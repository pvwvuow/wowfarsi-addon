# pvwvuow/wowfarsi-addon .github/workflows/curseforge-forever.yml
#
# When a WoWFA Forever release (tag forever-v...) is published, upload its zip to CurseForge.
# Needs: secret CF_API_KEY; variable CF_FOREVER_PROJECT_ID (or the older CF_PROJECT_ID).
# Optional: variable CF_GAME_TYPE (CurseForge flavour slug, default wow-forever),
#           variable CF_GAME_VERSION (force one exact version name).
#           variable CF_RELEASE_TYPE (release, beta or alpha; default release - the name still says beta).
# Every step prints what it found, so a red run says exactly what is missing.

name: CurseForge (WoWFA Forever)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag to upload again (e.g. forever-v1.0.0-beta.2)'
        required: true

permissions:
  contents: read

jobs:
  upload:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'forever-v')
    runs-on: ubuntu-latest
    steps:
      - name: Check settings
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          P1: ${{ vars.CF_FOREVER_PROJECT_ID }}
          P2: ${{ vars.CF_PROJECT_ID }}
        run: |
          ok=1
          if [ -z "$CF_API_KEY" ]; then echo "::error::secret CF_API_KEY is missing (Settings > Secrets and variables > Actions > Secrets)"; ok=0; fi
          if [ -z "$P1$P2" ]; then echo "::error::variable CF_FOREVER_PROJECT_ID is missing (Settings > Secrets and variables > Actions > Variables)"; ok=0; fi
          echo "project id variable: ${P1:-<none>} / old CF_PROJECT_ID: ${P2:-<none>}"
          [ "$ok" = 1 ]

      - name: Download the release zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'WoWFA-*.zip' --dir .
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          ls -l WoWFA-*.zip

      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_FOREVER_PROJECT_ID || vars.CF_PROJECT_ID }}
          CF_GAME_VERSION: ${{ vars.CF_GAME_VERSION }}
          CF_GAME_TYPE: ${{ vars.CF_GAME_TYPE }}
          CF_RELEASE_TYPE: ${{ vars.CF_RELEASE_TYPE }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -uo pipefail
          get() {
            code=$(curl -sS -o "$2" -w '%{http_code}' -H "X-Api-Token: $CF_API_KEY" "$1")
            echo "GET $1 -> HTTP $code"
            case "$code" in 2*) ;; *) head -c 600 "$2"; echo; echo "::error::CurseForge refused the API token (HTTP $code): make a new token at https://legacy.curseforge.com/account/api-tokens and put it in CF_API_KEY"; exit 1 ;; esac
          }
          get https://wow.curseforge.com/api/game/versions versions.json
          get https://wow.curseforge.com/api/game/version-types types.json
          GV=$(python3 - <<'PY'
          import json, os, sys
          vs = json.load(open("versions.json"))
          ts = json.load(open("types.json"))
          want = os.environ.get("CF_GAME_VERSION", "").strip()
          if want:
              ok = [v for v in vs if v.get("name") == want]
              if not ok:
                  sys.stderr.write("::error::CF_GAME_VERSION %r is not a CurseForge version\n" % want)
          else:
              slug = os.environ.get("CF_GAME_TYPE", "").strip() or "wow-forever"
              tids = [t["id"] for t in ts if t.get("slug") == slug]
              if not tids:
                  sys.stderr.write("::error::flavour %r not found; set CF_GAME_TYPE to one of: %s\n"
                                   % (slug, ", ".join(sorted(t.get("slug", "") for t in ts))))
              ok = sorted([v for v in vs if v.get("gameVersionTypeID") in tids], key=lambda v: v["id"])[-1:]
          if ok:
              sys.stderr.write("game version: %s (id %s)\n" % (ok[0].get("name"), ok[0]["id"]))
              print(ok[0]["id"])
          PY
          )
          [ -n "$GV" ] || { echo "::error::no CurseForge game version found"; exit 1; }
          REL="${CF_RELEASE_TYPE:-release}"  # the owner: users must get it by default, so CurseForge type release
          ZIP=$(ls WoWFA-*.zip | head -n1)
          NAME="wowfarsi-forever-${TAG#forever-v}.zip"
          cp "$ZIP" "$NAME"
          ZIP="$NAME"
          META=$(GV="$GV" REL="$REL" python3 -c 'import json,os; print(json.dumps({"changelog": open("notes.md").read(), "changelogType": "markdown", "displayName": "wowfarsi-forever-" + os.environ["TAG"].replace("forever-v", "", 1), "gameVersions": [int(os.environ["GV"])], "releaseType": os.environ["REL"]}))')
          code=$(curl -sS -o resp.json -w '%{http_code}' -X POST -H "X-Api-Token: $CF_API_KEY" \
            -F "metadata=$META" -F "file=@$ZIP" \
            "https://wow.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file")
          echo "upload to project $CF_PROJECT_ID -> HTTP $code"
          cat resp.json; echo
          case "$code" in
            2*) echo "uploaded $ZIP as $REL" ;;
            403) echo "::error::HTTP 403: the token's account is not an author of project $CF_PROJECT_ID, or the project id is wrong"; exit 1 ;;
            404) echo "::error::HTTP 404: project $CF_PROJECT_ID not found (check CF_FOREVER_PROJECT_ID)"; exit 1 ;;
            *) echo "::error::CurseForge upload failed (HTTP $code), see the response above"; exit 1 ;;
          esac
